[project]
name = "reqget"
version = "1.3.0"
description = "Smart Python dependency scanner and requirements generator"
authors = [
    { name="Leon Priest", email="leonpriest76@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE.md" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "setuptools",  # if needed
]

[project.scripts]
reqget = "reqget.cli:main"

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"